# CI workflow for mybcat
# Runs on all PRs and pushes to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --test tests/unit/*.test.mjs

      - name: Run Astro check
        run: npx astro check

      - name: Build site
        run: npm run build
        # Note: Artifact upload removed - Vercel handles deployment artifacts
        # and GitHub storage quota was being exceeded
