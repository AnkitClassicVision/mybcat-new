# CI workflow for mybcat
# Runs on all PRs and pushes to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: PR runs share one group per workflow+PR and supersede older runs;
# every non-PR run (push, schedule, manual) gets a unique run-scoped group so it
# can never cancel or replace another run, and can never be cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro check
        run: npx astro check

      - name: Build site
        run: npm run build
        # Note: Artifact upload removed - Vercel handles deployment artifacts
        # and GitHub storage quota was being exceeded
