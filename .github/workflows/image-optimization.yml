name: Image Optimization

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'public/videos/**'
  push:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'public/videos/**'

# Concurrency: PR runs share one group per workflow+PR and supersede older runs;
# every non-PR run (push, schedule, manual) gets a unique run-scoped group so it
# can never cancel or replace another run, and can never be cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  optimize-images:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for missing WebP images
        id: check
        run: |
          node scripts/check-missing-webp.js 2>&1 || echo "missing=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Convert missing images to WebP
        if: steps.check.outputs.missing == 'true'
        run: |
          node scripts/check-missing-webp.js --fix

      - name: Generate responsive variants for changed blog images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          declare -A changed_blog_images=()

          collect_changed_images() {
            while IFS= read -r -d '' image; do
              changed_blog_images["$image"]=1
            done
          }

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            collect_changed_images < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- public/images/blog)
          else
            collect_changed_images < <(git diff-tree --no-commit-id --name-only -r -z "$HEAD_SHA" -- public/images/blog)
          fi

          collect_changed_images < <(git diff --name-only -z -- public/images/blog)
          collect_changed_images < <(git ls-files --others --exclude-standard -z -- public/images/blog)

          for image in "${!changed_blog_images[@]}"; do
            case "$image" in
              *.webp)
                case "$image" in
                  *-400.webp|*-800.webp|*-1200.webp) continue ;;
                esac
                if [[ -f "$image" ]]; then
                  node scripts/generate-image-variants.js --only "$image"
                fi
                ;;
            esac
          done

      - name: Check for changes
        id: changes
        run: |
          test -z "$(git status --porcelain -- public/images public/videos)" || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit optimized images
        if: steps.changes.outputs.changes == 'true' && github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- 'public/images/*.webp' ':(glob)public/images/blog/**/*.webp' 'public/videos/*.webp'
          git commit -m "perf: auto-convert images to WebP format

          Automatically generated WebP versions for new images.

          🤖 Generated by GitHub Actions" || exit 0
          git push

      - name: Comment on PR if images were optimized
        if: steps.changes.outputs.changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Image Optimization

            I've automatically converted new images to WebP format for better PageSpeed scores.

            **Why this matters:**
            - WebP images are 25-35% smaller than PNG/JPEG
            - Faster load times improve mobile PageSpeed scores
            - Better Core Web Vitals (LCP) metrics

            The optimized images have been committed to this PR.`
            });
