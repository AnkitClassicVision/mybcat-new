name: Image Optimization

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'public/videos/**'
  push:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'public/videos/**'

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for missing WebP images
        id: check
        run: |
          node scripts/check-missing-webp.js 2>&1 || echo "missing=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Convert missing images to WebP
        if: steps.check.outputs.missing == 'true'
        run: |
          node scripts/check-missing-webp.js --fix

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit optimized images
        if: steps.changes.outputs.changes == 'true' && github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/images/*.webp public/videos/*.webp
          git commit -m "perf: auto-convert images to WebP format

          Automatically generated WebP versions for new images.

          🤖 Generated by GitHub Actions" || exit 0
          git push

      - name: Comment on PR if images were optimized
        if: steps.changes.outputs.changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Image Optimization

            I've automatically converted new images to WebP format for better PageSpeed scores.

            **Why this matters:**
            - WebP images are 25-35% smaller than PNG/JPEG
            - Faster load times improve mobile PageSpeed scores
            - Better Core Web Vitals (LCP) metrics

            The optimized images have been committed to this PR.`
            });
