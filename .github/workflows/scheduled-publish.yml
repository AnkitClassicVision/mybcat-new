name: Publish Scheduled Posts

on:
  schedule:
    # Run daily at 9 AM UTC (4 AM EST, 1 AM PST)
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write
  issues: write   # Needed for auto-remediation notification issue (#10 regression)

jobs:
  publish:
    runs-on: self-hosted
    env:
      AAC_AGENT_ID: mybcat-content-lifecycle
      AAC_HMAC_KEY: ${{ secrets.AAC_HMAC_KEY }}
      AAC_INGEST_ENDPOINT: ${{ vars.AAC_INGEST_ENDPOINT }}
      AAC_TRACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: AAC emit NODE_STARTED
        run: bash .github/scripts/aac-emit.sh 06-scheduled-publish NODE_STARTED '{"github_run_id":"${{ github.run_id }}","trigger":"${{ github.event_name }}"}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: AAC emit deps installed
        run: bash .github/scripts/aac-emit.sh 06-scheduled-publish NODE_OUTPUT '{"kind":"deps_ready"}'

      - name: Pre-publish quality check
        run: node scripts/validators/validate-content-quality.js --scheduled-only
        continue-on-error: true

      - name: Auto-remediate quality failures
        run: node scripts/remediate-quality.js
        continue-on-error: true
        env:
          # Preferred: OpenRouter (lets us swap models via OPENROUTER_MODEL).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          # Fallback: Anthropic direct (only used if OPENROUTER_API_KEY unset).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit remediation changes
        id: remediation_commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            CHANGED_FILES=$(git diff --cached --name-only)
            git commit -m "Auto-remediate quality gate failures for $(date +%Y-%m-%d)"
            git push
            echo "remediated=true" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" > /tmp/remediated_files.txt
          else
            echo "remediated=false" >> $GITHUB_OUTPUT
          fi

      - name: Email remediation changes to owner
        if: steps.remediation_commit.outputs.remediated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readFileSync('/tmp/remediated_files.txt', 'utf8').trim();
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Auto-remediation ran on ${date} — review changes`,
              body: [
                `## Auto-remediation applied (${date})`,
                '',
                'The scheduled-publish workflow auto-remediated quality gate failures on these files:',
                '',
                '```',
                files,
                '```',
                '',
                `[View workflow run](${runUrl})`,
                '',
                'Review the changes and close this issue once confirmed.',
              ].join('\n'),
              labels: ['auto-remediation', 'needs-review'],
            });

      - name: Audit deactivated-links.json schema
        run: node scripts/validators/validate-deactivated-links.js --verbose
        continue-on-error: true

      - name: AAC emit pre-publish ok
        run: bash .github/scripts/aac-emit.sh 06-scheduled-publish NODE_OUTPUT '{"kind":"pre_publish_ok"}'

      - name: Run publish script
        run: node scripts/publish-scheduled.js

      - name: AAC emit publish complete
        run: bash .github/scripts/aac-emit.sh 06-scheduled-publish NODE_OUTPUT '{"kind":"publish_script_complete"}'

      - name: Auto-deactivate any remaining broken cross-links
        id: deactivate
        run: node scripts/deactivate-broken-links.js
        continue-on-error: true

      - name: Warn if deactivation failed
        if: steps.deactivate.outcome == 'failure'
        run: |
          echo "::warning title=Cross-Link Deactivation Failed::deactivate-broken-links.js exited non-zero. Broken cross-links may remain in published posts. Check the step log above."

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Publish scheduled posts for $(date +%Y-%m-%d)"
          git push

      - name: Stage 18 — audit:live (Playwright fetch of published posts)
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          npm_config_cache: /home/github-runner/.npm
        run: |
          echo "🔍 Stage 18 audit:live — Playwright-fetch published URLs and verify they render correctly..."
          BLOG_WRITER_DIR="/home/github-runner/seo-pipeline/repos/blog_writer"
          if [ ! -d "$BLOG_WRITER_DIR" ]; then
            echo "⚠️ blog_writer repo not found at $BLOG_WRITER_DIR (seeded by seo_autopilot.yml), skipping"
            exit 0
          fi
          cd "$BLOG_WRITER_DIR"
          # Pull latest so we run the current scripts/audit_live.js
          git fetch origin master --quiet || true
          git checkout master --quiet || true
          git pull --ff-only origin master --quiet || echo "git pull failed, continuing with local copy"
          if [ ! -f scripts/audit_live.js ]; then
            echo "⚠️ scripts/audit_live.js not found, skipping"
            exit 0
          fi
          # Install only if node_modules is stale
          if [ ! -d node_modules ] || [ package.json -nt node_modules ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          fi
          FROM_DATE=$(date -u -d "1 day ago" +%Y-%m-%d)
          TO_DATE=$(date -u +%Y-%m-%d)
          echo "Audit window: $FROM_DATE → $TO_DATE"
          # Let npm exit naturally. continue-on-error preserves the workflow.
          npm run audit:live -- --from="$FROM_DATE" --to="$TO_DATE" --status=published

      - name: AAC emit NODE_ENDED
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            bash .github/scripts/aac-emit.sh 06-scheduled-publish NODE_ENDED '{"job_status":"success","github_run_id":"${{ github.run_id }}"}'
          else
            bash .github/scripts/aac-emit.sh 06-scheduled-publish ERROR '{"job_status":"${{ job.status }}","github_run_id":"${{ github.run_id }}"}'
          fi
