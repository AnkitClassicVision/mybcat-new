name: Weekly SEO Audit

on:
  schedule:
    # Run every Monday at 8am UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  weekly-audit:
    name: Full SEO Audit
    runs-on: self-hosted
    env:
      AAC_AGENT_ID: mybcat-content-lifecycle
      AAC_HMAC_KEY: ${{ secrets.AAC_HMAC_KEY }}
      AAC_INGEST_ENDPOINT: ${{ vars.AAC_INGEST_ENDPOINT }}
      AAC_TRACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: AAC emit NODE_STARTED
        continue-on-error: true
        run: bash .github/scripts/aac-emit.sh 08-weekly-audit NODE_STARTED '{"github_run_id":"${{ github.run_id }}","trigger":"${{ github.event_name }}"}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check approved topic queue health
        run: npm run validate:seo-queue

      - name: Check SOT Config Drift
        continue-on-error: true
        run: |
          echo "## SOT Drift Check" >> $GITHUB_STEP_SUMMARY
          # Clone ongoing_seo to check enforcement config drift
          ONGOING_SEO_DIR=$(mktemp -d)
          git clone --depth 1 https://github.com/AnkitClassicVision/ongoing_seo.git "$ONGOING_SEO_DIR" 2>/dev/null || true
          if [ -f "$ONGOING_SEO_DIR/scripts/generate_enforcement_configs.py" ]; then
            python3 "$ONGOING_SEO_DIR/scripts/generate_enforcement_configs.py" --check --mybcat-dir "$(pwd)" 2>&1 | tee drift.log
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat drift.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Could not clone ongoing_seo for drift check" >> $GITHUB_STEP_SUMMARY
          fi
          rm -rf "$ONGOING_SEO_DIR"

      - name: Run Pre-Build Validations
        id: prebuild
        run: |
          set -o pipefail
          echo "## Pre-Build Validation Results" >> $GITHUB_STEP_SUMMARY
          npm run validate:terms -- --verbose 2>&1 | tee terms.log
          npm run validate:meta -- --verbose 2>&1 | tee meta.log
          npm run validate:h1 -- --verbose 2>&1 | tee h1.log
          npm run validate:enterprise-links -- --verbose 2>&1 | tee links.log

      - name: Build Site
        run: npm run build

      - name: Run Post-Build Validations
        id: postbuild
        run: |
          set -o pipefail
          echo "## Post-Build Validation Results" >> $GITHUB_STEP_SUMMARY
          npm run validate:schema -- --verbose 2>&1 | tee schema.log
          npm run validate:links -- --verbose 2>&1 | tee internal-links.log

      - name: Generate Audit Summary
        run: |
          echo "# Weekly SEO Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Validation Logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Forbidden Terms" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 terms.log >> $GITHUB_STEP_SUMMARY || echo "No issues" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Enterprise Links" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 links.log >> $GITHUB_STEP_SUMMARY || echo "No issues" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Audit Logs
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 30

      - name: Live SEO Performance Snapshot (GSC)
        env:
          GSC_TOKEN_PATH: ${{ secrets.GSC_TOKEN_PATH }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          START_DATE=$(date -u -d '30 days ago' '+%Y-%m-%d')
          END_DATE=$(date -u -d '3 days ago' '+%Y-%m-%d')
          GSC_TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$GSC_TMP_DIR"' EXIT
          python3 scripts/export-gsc.py --site sc-domain:mybcat.com --start "$START_DATE" --end "$END_DATE" --dimensions query --out "$GSC_TMP_DIR/queries.csv" --row-limit 25000
          python3 scripts/export-gsc.py --site sc-domain:mybcat.com --start "$START_DATE" --end "$END_DATE" --dimensions date --out "$GSC_TMP_DIR/dates.csv" --row-limit 100
          python3 scripts/summarize-gsc-snapshot.py --queries "$GSC_TMP_DIR/queries.csv" --dates "$GSC_TMP_DIR/dates.csv" --json-out "$GSC_TMP_DIR/summary.json" --markdown-out "$GSC_TMP_DIR/summary.md"
          cat "$GSC_TMP_DIR/summary.md" >> $GITHUB_STEP_SUMMARY

      - name: Repository Content Snapshot
        run: |
          echo "## SEO Performance Snapshot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count published posts, posts with modifiedDate, posts missing canonical
          TOTAL=$(find src/content/blog -name "*.md" -o -name "*.mdx" | wc -l)
          WITH_MOD=$(grep -rl "modifiedDate:" src/content/blog/ 2>/dev/null | wc -l)
          MISSING_CANONICAL=$(find src/content/blog -name "*.md" -o -name "*.mdx" -exec grep -L "canonical:" {} \; 2>/dev/null | wc -l)
          REDIRECT_POSTS=$(grep -rl "redirectTo:" src/content/blog/ 2>/dev/null | wc -l)

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total blog posts | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Posts with modifiedDate | $WITH_MOD |" >> $GITHUB_STEP_SUMMARY
          echo "| Posts missing canonical | $MISSING_CANONICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Posts with redirectTo (should be draft) | $REDIRECT_POSTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Redirects in vercel.json | $(python3 -c 'import json; print(len(json.load(open("vercel.json")).get("redirects",[])))') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for new cannibalization: multiple posts with same seoTitle keyword
          echo "### Potential Cannibalization (duplicate seoTitle keywords)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -rh "seoTitle:" src/content/blog/ 2>/dev/null | sort | uniq -cd | head -10 >> $GITHUB_STEP_SUMMARY || echo "None found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for Critical Issues
        run: |
          FAILURES=$(awk '/^✗|^ERROR:/{ total += 1 } END { print total + 0 }' *.log)
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES explicit validation failures found in weekly audit logs"
            exit 1
          fi
          echo "No explicit validation failures found"

      - name: AAC emit NODE_ENDED
        continue-on-error: true
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            bash .github/scripts/aac-emit.sh 08-weekly-audit NODE_ENDED '{"job_status":"success","github_run_id":"${{ github.run_id }}"}'
          else
            bash .github/scripts/aac-emit.sh 08-weekly-audit ERROR '{"job_status":"${{ job.status }}","github_run_id":"${{ github.run_id }}"}'
          fi
