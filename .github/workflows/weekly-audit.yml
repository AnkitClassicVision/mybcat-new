name: Weekly SEO Audit

on:
  schedule:
    # Run every Monday at 8am UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  weekly-audit:
    name: Full SEO Audit
    runs-on: self-hosted
    env:
      AAC_AGENT_ID: mybcat-content-lifecycle
      AAC_HMAC_KEY: ${{ secrets.AAC_HMAC_KEY }}
      AAC_INGEST_ENDPOINT: ${{ vars.AAC_INGEST_ENDPOINT }}
      AAC_TRACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: AAC emit NODE_STARTED
        run: bash .github/scripts/aac-emit.sh 08-weekly-audit NODE_STARTED '{"github_run_id":"${{ github.run_id }}","trigger":"${{ github.event_name }}"}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Advisory source-of-truth drift clone
        continue-on-error: true
        run: |
          echo "## SOT Drift Check" >> $GITHUB_STEP_SUMMARY
          # Clone ongoing_seo to check enforcement config drift
          ONGOING_SEO_DIR=$(mktemp -d)
          git clone --depth 1 https://github.com/AnkitClassicVision/ongoing_seo.git "$ONGOING_SEO_DIR" 2>/dev/null
          if [ -f "$ONGOING_SEO_DIR/scripts/generate_enforcement_configs.py" ]; then
            python3 "$ONGOING_SEO_DIR/scripts/generate_enforcement_configs.py" --check --mybcat-dir "$(pwd)" 2>&1 | tee drift.log
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat drift.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Could not clone ongoing_seo for drift check" >> $GITHUB_STEP_SUMMARY
          fi
          rm -rf "$ONGOING_SEO_DIR"

      - name: Validate forbidden terms
        id: validate_terms
        continue-on-error: true
        run: npm run validate:terms -- --verbose 2>&1 | tee terms.log

      - name: Validate meta tags
        id: validate_meta
        continue-on-error: true
        run: npm run validate:meta -- --verbose 2>&1 | tee meta.log

      - name: Validate H1 tags
        id: validate_h1
        continue-on-error: true
        run: npm run validate:h1 -- --verbose 2>&1 | tee h1.log

      - name: Validate enterprise links
        id: validate_enterprise_links
        continue-on-error: true
        run: npm run validate:enterprise-links -- --verbose 2>&1 | tee links.log

      - name: Build Site
        run: npm run build

      - name: Validate schema markup
        id: validate_schema
        continue-on-error: true
        run: npm run validate:schema -- --verbose 2>&1 | tee schema.log

      - name: Validate internal links
        id: validate_internal_links
        continue-on-error: true
        run: npm run validate:links -- --verbose 2>&1 | tee internal-links.log

      - name: Generate Audit Summary
        run: |
          echo "# Weekly SEO Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Validation Logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Forbidden Terms" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f terms.log ]; then tail -20 terms.log >> $GITHUB_STEP_SUMMARY; else echo "No issues" >> $GITHUB_STEP_SUMMARY; fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Enterprise Links" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f links.log ]; then tail -30 links.log >> $GITHUB_STEP_SUMMARY; else echo "No issues" >> $GITHUB_STEP_SUMMARY; fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Audit Logs
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 30

      - name: Advisory - SEO Performance Snapshot (GSC)
        continue-on-error: true
        env:
          GSC_TOKEN_PATH: ${{ secrets.GSC_TOKEN_PATH }}
        run: |
          echo "## SEO Performance Snapshot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count published posts, posts with modifiedDate, posts missing canonical
          TOTAL=$(find src/content/blog -name "*.md" -o -name "*.mdx" | wc -l)
          WITH_MOD=$(grep -rl "modifiedDate:" src/content/blog/ 2>/dev/null | wc -l)
          MISSING_CANONICAL=$(find src/content/blog -name "*.md" -o -name "*.mdx" -exec grep -L "canonical:" {} \; 2>/dev/null | wc -l)
          REDIRECT_POSTS=$(grep -rl "redirectTo:" src/content/blog/ 2>/dev/null | wc -l)

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total blog posts | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Posts with modifiedDate | $WITH_MOD |" >> $GITHUB_STEP_SUMMARY
          echo "| Posts missing canonical | $MISSING_CANONICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Posts with redirectTo (should be draft) | $REDIRECT_POSTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Redirects in vercel.json | $(python3 -c 'import json; print(len(json.load(open("vercel.json")).get("redirects",[])))') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for new cannibalization: multiple posts with same seoTitle keyword
          echo "### Potential Cannibalization (duplicate seoTitle keywords)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if ! grep -rh "seoTitle:" src/content/blog/ 2>/dev/null | sort | uniq -cd | head -10 >> $GITHUB_STEP_SUMMARY; then
            echo "None found" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for Critical Issues
        run: |
          # Count errors in logs
          ERRORS=$(grep -c "✗\|Error\|error" *.log 2>/dev/null) || ERRORS=0
          if [ "$ERRORS" -gt "5" ]; then
            echo "::warning::$ERRORS critical issues found in weekly audit"
          fi

      - name: Aggregate validator outcomes
        if: always()
        run: |
          FAILED=0
          for result in \
            "terms:${{ steps.validate_terms.outcome }}" \
            "meta:${{ steps.validate_meta.outcome }}" \
            "h1:${{ steps.validate_h1.outcome }}" \
            "enterprise-links:${{ steps.validate_enterprise_links.outcome }}" \
            "schema:${{ steps.validate_schema.outcome }}" \
            "internal-links:${{ steps.validate_internal_links.outcome }}"; do
            name=${result%%:*}
            outcome=${result#*:}
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: AAC emit NODE_ENDED
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            bash .github/scripts/aac-emit.sh 08-weekly-audit NODE_ENDED '{"job_status":"success","github_run_id":"${{ github.run_id }}"}'
          else
            bash .github/scripts/aac-emit.sh 08-weekly-audit ERROR '{"job_status":"${{ job.status }}","github_run_id":"${{ github.run_id }}"}'
          fi
