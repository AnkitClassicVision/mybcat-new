name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 10:00 America/New_York. This is the hard paint check.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Concurrency: PR runs share one group per workflow+PR and supersede older runs;
# every non-PR run (push, schedule, manual) gets a unique run-scoped group so it
# can never cancel or replace another run, and can never be cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lighthouse:
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ github.token }}
      AAC_AGENT_ID: mybcat-content-lifecycle
      AAC_HMAC_KEY: ${{ secrets.AAC_HMAC_KEY }}
      AAC_INGEST_ENDPOINT: ${{ vars.AAC_INGEST_ENDPOINT }}
      AAC_TRACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AAC emit NODE_STARTED
        run: bash .github/scripts/aac-emit.sh 10-lighthouse NODE_STARTED '{"github_run_id":"${{ github.run_id }}","trigger":"${{ github.event_name }}"}'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Select newest published post
        shell: bash
        run: |
          newest_post_url="$(node scripts/newest-post-url.mjs)"
          newest_post_slug="${newest_post_url%/}"
          newest_post_slug="${newest_post_slug##*/}"
          printf 'LHCI_NEWEST_POST_URL=%s\n' "$newest_post_url" >> "$GITHUB_ENV"
          printf '## Lighthouse dynamic article\n\n- Selected slug: `%s`\n' "$newest_post_slug" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide paint gate
        shell: bash
        run: |
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')"
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              files="$(gh api --paginate "repos/${{ github.repository }}/compare/${before}...${{ github.sha }}" --jq '.files[].filename')"
            fi
          fi
          level="$(node scripts/lighthouse-paint-gate.mjs --event "${{ github.event_name }}" --files "$files")"
          case "$level" in
            error|warn) ;;
            *) echo "Unknown paint gate: $level" >&2; exit 2 ;;
          esac
          printf 'LHCI_FCP_LEVEL=%s\n' "$level" >> "$GITHUB_ENV"
          printf '## Paint gate\n\n- Level: `%s`\n- Event: `%s`\n' "$level" "${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.cjs'
          # uploadArtifacts disabled: the action's CreateArtifact call is
          # what's failing CI when our Actions storage quota is full. The
          # report still uploads to temporaryPublicStorage (external) and
          # the format-lighthouse-score step still produces a PR comment
          # from local .lighthouseci/manifest.json, so we lose nothing
          # operationally. The cleanup-artifacts.yml workflow now sweeps
          # nightly; once GitHub recalculates usage (6-12h), this can flip
          # back to true.
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Format lighthouse score
        id: format_lighthouse_score
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const manifestPath = '.lighthouseci/manifest.json';
              if (!fs.existsSync(manifestPath)) {
                core.setOutput('comment', '## Lighthouse Report\n\nNo Lighthouse results found.');
                return;
              }

              const results = JSON.parse(fs.readFileSync(manifestPath));

              let comment = '## Lighthouse Report\n\n';
              comment += '| URL | Performance | Accessibility | Best Practices | SEO |\n';
              comment += '|-----|-------------|---------------|----------------|-----|\n';

              for (const result of results) {
                const url = result.url.replace('http://localhost:4321', '');
                const report = JSON.parse(fs.readFileSync(result.jsonPath));
                const categories = report.categories;

                if (!categories) continue;

                const formatScore = (score) => {
                  if (score === null || score === undefined) return 'N/A';
                  const pct = Math.round(score * 100);
                  if (pct >= 90) return `${pct}`;
                  if (pct >= 50) return `${pct}`;
                  return `${pct}`;
                };

                comment += `| ${url || '/'} `;
                comment += `| ${formatScore(categories.performance?.score)} `;
                comment += `| ${formatScore(categories.accessibility?.score)} `;
                comment += `| ${formatScore(categories['best-practices']?.score)} `;
                comment += `| ${formatScore(categories.seo?.score)} |\n`;
              }

              core.setOutput('comment', comment);
            } catch (error) {
              core.warning(`Failed to format Lighthouse scores: ${error.message}`);
              core.setOutput('comment', '## Lighthouse Report\n\nFailed to parse Lighthouse results.');
            }

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.format_lighthouse_score.outputs.comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.format_lighthouse_score.outputs.comment }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: AAC emit NODE_ENDED
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            bash .github/scripts/aac-emit.sh 10-lighthouse NODE_ENDED '{"job_status":"success","github_run_id":"${{ github.run_id }}"}'
          else
            bash .github/scripts/aac-emit.sh 10-lighthouse ERROR '{"job_status":"${{ job.status }}","github_run_id":"${{ github.run_id }}"}'
          fi
