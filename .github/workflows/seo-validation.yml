name: SEO & Content Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'vercel.json'
      - 'CONTROLS.md'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'

jobs:
  pre-build-validation:
    name: Pre-Build Checks
    runs-on: self-hosted
    env:
      AAC_AGENT_ID: mybcat-content-lifecycle
      AAC_HMAC_KEY: ${{ secrets.AAC_HMAC_KEY }}
      AAC_INGEST_ENDPOINT: ${{ vars.AAC_INGEST_ENDPOINT }}
      AAC_TRACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AAC emit NODE_STARTED
        run: bash .github/scripts/aac-emit.sh 09-seo-validation NODE_STARTED '{"github_run_id":"${{ github.run_id }}","trigger":"${{ github.event_name }}"}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Forbidden Terms
        run: npm run validate:terms

      - name: Validate Meta Tags
        run: npm run validate:meta

      - name: Validate H1 Tags
        run: npm run validate:h1

      - name: Validate Enterprise Links
        run: npm run validate:enterprise-links

      - name: Validate Content Quality (PR — diff-scoped vs main)
        if: github.event_name == 'pull_request'
        env:
          DIFF_BASE: origin/main
        run: npm run validate:content-quality -- --changed-files-only

      - name: Validate Content Quality (push — diff-scoped vs prev commit)
        if: github.event_name == 'push'
        env:
          DIFF_BASE: ${{ github.event.before }}
        run: npm run validate:content-quality -- --changed-files-only

      - name: Workspace integrity check (diagnostic)
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "--- porcelain ---"
          git status --porcelain | head -40
          echo "--- diff vs HEAD ---"
          git diff HEAD --stat | tail -10
          echo "--- untracked blog files ---"
          git ls-files --others --exclude-standard src/content/blog/ | head -10
          echo "--- aggregate content hash ---"
          find src/content/blog -type f | sort | xargs md5sum | md5sum
          echo "--- flagged-file evidence ---"
          md5sum src/content/blog/ai-is-your-secret-weapon-for-efficiency-in-your-eye-care-clinic.md src/content/blog/operational-efficiency-in-optometry-seeing-the-bigger-picture.md 2>&1
          echo "link-count: $(grep -c 'optometry-front-office-standardization' src/content/blog/ai-is-your-secret-weapon-for-efficiency-in-your-eye-care-clinic.md || true)"
          node --version; npm ls gray-matter 2>&1 | tail -2
          echo "--- index flags (skip-worktree/assume-unchanged) ---"
          git ls-files -v src/content/blog/ | grep -v "^H " | head -15
          echo "--- git config filters/hooks ---"
          git config --list --show-origin 2>/dev/null | grep -iE "filter|hookspath|template" | head -10
          ls .git/hooks/ | grep -v sample | head -10
          echo "--- runner identity ---"
          hostname; whoami; pwd

      - name: Validate Cross-Links
        run: npm run validate:cross-links

      - name: Validate Deactivated-Links Schema
        run: npm run validate:deactivated-links

      - name: Validate Publish Dates
        run: npm run validate:publish-dates

      - name: Validate Citations (PR — diff-scoped vs main)
        if: github.event_name == 'pull_request'
        env:
          DIFF_BASE: origin/main
        run: npm run validate:citations -- --changed-files-only

      - name: Validate Citations (push — diff-scoped vs prev commit)
        if: github.event_name == 'push'
        env:
          DIFF_BASE: ${{ github.event.before }}
        run: npm run validate:citations -- --changed-files-only

  post-build-validation:
    name: Post-Build Checks
    runs-on: self-hosted
    needs: pre-build-validation
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate Schema Markup
        run: npm run validate:schema

      - name: Validate Internal Links
        run: npm run validate:links

      - name: Validate Redirects (no chains)
        run: npm run validate:redirects

      - name: Validate Sitemap URLs (local build)
        run: npm run validate:sitemap

      - name: Validate URL Stability
        run: npm run validate:url-stability

  content-quality:
    name: Content Quality
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run check

  aac-finalize:
    name: AAC finalize (advisory)
    continue-on-error: true
    needs: [pre-build-validation, post-build-validation, content-quality]
    if: always()
    runs-on: self-hosted
    env:
      AAC_AGENT_ID: mybcat-content-lifecycle
      AAC_HMAC_KEY: ${{ secrets.AAC_HMAC_KEY }}
      AAC_INGEST_ENDPOINT: ${{ vars.AAC_INGEST_ENDPOINT }}
      AAC_TRACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Emit aggregate result
        run: |
          PRE='${{ needs.pre-build-validation.result }}'
          POST='${{ needs.post-build-validation.result }}'
          QUAL='${{ needs.content-quality.result }}'
          if [ "$PRE" = "success" ] && [ "$POST" = "success" ] && [ "$QUAL" = "success" ]; then
            bash .github/scripts/aac-emit.sh 09-seo-validation NODE_ENDED '{"job_status":"success","pre":"'$PRE'","post":"'$POST'","quality":"'$QUAL'"}'
          else
            bash .github/scripts/aac-emit.sh 09-seo-validation ERROR '{"job_status":"mixed","pre":"'$PRE'","post":"'$POST'","quality":"'$QUAL'"}'
          fi
