name: Post Publish Verify

on:
  workflow_run:
    workflows: ['Publish Scheduled Posts']
    types: [completed]
  workflow_dispatch:
    inputs:
      slug:
        description: Blog post slug to verify
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The publish run uploads this artifact; latest-run.json lists the posts it published.
      # A missing artifact is handled in the next step, so this step must not fail the job.
      - name: Download scheduled-publish run manifest
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scheduled-publish-run-manifest
          path: artifacts/scheduled-publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Determine post slugs
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SLUG: ${{ inputs.slug }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';

          const output = (name, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          const validateSlug = (slug) => {
            if (!/^[a-z0-9][a-z0-9_-]*$/i.test(slug)) throw new Error(`Invalid blog slug: ${JSON.stringify(slug)}`);
            return slug;
          };

          if (process.env.EVENT_NAME === 'workflow_dispatch') {
            const requestedSlug = process.env.DISPATCH_SLUG?.trim() ?? '';
            if (!requestedSlug) throw new Error('workflow_dispatch requires a slug.');
            const slug = validateSlug(requestedSlug);
            output('slugs', slug);
            output('skip', 'false');
            summary(`## Post-publish verification\n\nManual target: \`${slug}\``);
          } else if (process.env.EVENT_NAME === 'workflow_run') {
            const manifestPath = 'artifacts/scheduled-publish/latest-run.json';
            if (!existsSync(manifestPath)) {
              const message = `The run manifest (artifact scheduled-publish-run-manifest, file latest-run.json) was not found for publish run ${process.env.TRIGGER_RUN_ID}. Without it the published posts are unknown, so nothing was verified. There is no fallback to the newest post.`;
              console.log(`::error title=Run manifest missing::${message}`);
              summary(`## Post-publish verification\n\nFAILED, nothing verified: ${message}`);
              process.exit(1);
            }
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            const publishedCount = Number(manifest.posts_published ?? 0);
            if (!Number.isInteger(publishedCount) || publishedCount < 0) {
              throw new Error('latest-run.json has an invalid posts_published value.');
            }
            if (publishedCount === 0) {
              output('skip', 'true');
              summary('## Post-publish verification\n\nNothing to verify: latest-run.json shows zero posts published.');
            } else {
              const slugs = Array.isArray(manifest.slugs)
                ? manifest.slugs.map((slug) => String(slug).trim()).filter(Boolean).map(validateSlug)
                : [];
              if (slugs.length !== publishedCount) {
                throw new Error(`latest-run.json reports ${publishedCount} published post(s) but contains ${slugs.length} slug(s).`);
              }
              output('slugs', slugs.join(','));
              output('skip', 'false');
              summary(`## Post-publish verification\n\nManifest targets: ${slugs.map((slug) => `\`${slug}\``).join(', ')}`);
            }
          } else {
            throw new Error(`Unsupported event: ${process.env.EVENT_NAME}`);
          }
          NODE

      - name: Wait for Vercel propagation
        if: steps.targets.outputs.skip != 'true'
        run: sleep 90

      - name: Verify live posts and submit IndexNow
        if: steps.targets.outputs.skip != 'true'
        env:
          VERIFY_SLUGS: ${{ steps.targets.outputs.slugs }}
        run: |
          set +e
          OUTPUT=$(node scripts/post-publish-verify.mjs --slug "$VERIFY_SLUGS" 2>&1)
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"
          {
            echo
            echo "### Verification result"
            echo
            echo "Exit code: $STATUS"
            echo
            echo '```text'
            printf '%s\n' "$OUTPUT" | sed 's/```/` ` `/g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$STATUS"
