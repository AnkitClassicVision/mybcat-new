node_id: "03-gsc-inspect"
node_number: 3
name: "GSC inspect"
description: "Google Search Console URL inspector on Tier-1 URLs and recently published posts. Read-only: reports indexation status, mobile usability, structured data issues."
runtime_type: "D"
lane: "system"
input_schema: { type: "object", properties: { url_list: { type: "array", items: { type: "string" } } } }
output_schema: { type: "object", properties: { inspected: { type: "integer" }, indexing_issues: { type: "array" } } }
latency_budget_ms: 120000
daily_volume_estimate: 100
failure_mode: "non-zero exit on auth failure; per-URL errors aggregated into report; 429 backoff + skip if persistent"
named_owner: "Ankit"
implementation: "scripts/gsc-url-inspector.js + scripts/gsc-check-tier1-urls.js"
deterministic_proof: "GSC URL inspection API is a pure read; same URL on same day returns the same indexation snapshot. No writes to GSC, no writes to repo."
